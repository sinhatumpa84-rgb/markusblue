; PlatformIO Project Configuration File for MARKUSBLUE (SIH26052)
; Target MCU: Espressif ESP32-S3 N16R8 (16MB Flash, 8MB Octal PSRAM)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Serial & Upload
monitor_speed = 115200
upload_speed = 921600

; Memory & Partitioning Configuration (16MB Flash, 8MB Octal PSRAM)
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

; Compiler Flags & Optimizations
build_flags =
    -O3
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_ESP32S3_DEFAULT_CPU_FREQ_240=1
    -DCONFIG_SPIRAM_MODE_OCT=1
    -DMARKUSBLUE_SAMPLE_RATE=16000
    -DMARKUSBLUE_N_FFT=256
    -DMARKUSBLUE_HOP_SIZE=64
    -DMARKUSBLUE_NUM_BINS=129

; Dependent Libraries
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5
    electroniccats/MPU6050 @ ^0.6.0
    greiman/SdFat @ ^2.2.0

lib_archive = false
